  <text x="874" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="#214d27">TREE OF HOPE</text>
  <text x="874" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="84" font-weight="700" fill="#20170f">
    <tspan x="874" dy="0">“What was given to you</tspan>
    <tspan x="874" dy="110">that you want to pass on?”</tspan>
  </text>
  <text x="874" y="835" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#79522d">Write it or say it.</text>
  <text x="874" y="925" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#20170f">Your leaf joins the tree at holditdown.uk/tree-of-hope</text>
